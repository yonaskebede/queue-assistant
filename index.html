
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>Queue Assistant</title>
<style>
* { box-sizing: border-box; }
body {
  background: #121212;
  color: #fff;
  font: 16px system-ui, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 24px;
}
h1 { font-size: 30px; }
p { color: #aaa; line-height: 1.5; }
textarea {
  width: 100%;
  min-height: 250px;
  padding: 16px;
  background: #242424;
  color: white;
  border: 1px solid #555;
  border-radius: 12px;
  font: inherit;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 0;
  border-radius: 30px;
  background: #1DB954;
  color: #000;
  font: bold 16px system-ui;
}
button:disabled { opacity: .4; }
.secondary { background: #333; color: white; }
#status {
  white-space: pre-wrap;
  line-height: 1.6;
  font-size: 14px;
}
#picker { width: min(94vw, 560px); max-height: 90dvh; padding: 18px; border: 1px solid #555; border-radius: 18px; background: #242424; color: white; overflow: auto; }
#picker::backdrop { background: #000b; }
#picker h2 { margin: 0; font-size: 22px; }
#options { display: grid; gap: 10px; }
#options label { display: flex; align-items: center; gap: 12px; padding: 12px; border: 2px solid #555; border-radius: 12px; cursor: pointer; min-height: 64px; }
#options label:has(input:checked) { border-color: #1DB954; background: #193526; }
#options input { accent-color: #1DB954; flex-shrink: 0; width: 20px; height: 20px; }
#options img { width: 52px; height: 52px; object-fit: cover; border-radius: 5px; }
#options span { min-width: 0; overflow-wrap: anywhere; }
#options small { display: block; color: #ccc; margin-top: 4px; }
#picker-actions { position: sticky; bottom: -18px; background: #242424; padding: 8px 0 18px; }
</style>
</head>
<body>

<h1>Queue Assistant</h1>
<p>Discover. Listen. Collect.</p>

<button id="login">Connect Spotify</button>
<p id="connection">Not connected</p>

<textarea id="songs"
placeholder="Paste song titles and artists or Spotify track links, one per line:
La Femme d'Argent — Air
In the Waiting Line — Zero 7
Loud Places — Jamie xx"></textarea>

<button id="queue" disabled>Add all to Spotify queue</button>
<button id="clear" class="secondary">Clear list</button>

<p id="status" aria-live="polite"></p>
<section id="batch-result" hidden></section>
<dialog id="picker" aria-labelledby="picker-title" aria-describedby="picker-query">
  <h2 id="picker-title">Choose your track</h2>
  <p id="picker-query"></p>
  <div id="options" role="radiogroup" aria-label="Potential tracks"></div>
  <div id="picker-actions">
    <button id="pick-add" disabled>Confirm &amp; continue</button>
    <button id="pick-skip" class="secondary">Skip this song</button>
  </div>
</dialog>

<script>
const clientId = "83ce16cb4f4449acb0fdcd3b78c1c294";
const redirect = "https://yonaskebede.github.io/queue-assistant/";
const scope = "user-modify-playback-state user-read-playback-state";

const $ = id => document.getElementById(id);
const log = message => {
  $("status").textContent += message + "\n";
};

function randomString() {
  return Array.from(
    crypto.getRandomValues(new Uint8Array(48)),
    n => n.toString(16).padStart(2, "0")
  ).join("");
}

function base64url(buffer) {
  return btoa(String.fromCharCode(
    ...new Uint8Array(buffer)
  )).replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function authorize() {
  const verifier = randomString();
  const state = randomString();
  sessionStorage.setItem("verifier", verifier);
  sessionStorage.setItem("state", state);

  const challenge = base64url(
    await crypto.subtle.digest(
      "SHA-256",
      new TextEncoder().encode(verifier)
    )
  );

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    redirect_uri: redirect,
    scope,
    state,
    code_challenge_method: "S256",
    code_challenge: challenge
  });

  location.href =
    "https://accounts.spotify.com/authorize?" + params;
}

async function tokenRequest(params) {
  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams(params)
    }
  );

  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.error_description || data.error);
  }

  localStorage.setItem("access", data.access_token);
  localStorage.setItem(
    "expires",
    Date.now() + data.expires_in * 1000
  );
  if (data.refresh_token) {
    localStorage.setItem("refresh", data.refresh_token);
  }
  return data.access_token;
}

async function accessToken() {
  if (Date.now() < Number(localStorage.getItem("expires")) - 60000) {
    return localStorage.getItem("access");
  }

  const refresh = localStorage.getItem("refresh");
  if (!refresh) throw new Error("Connect Spotify first.");

  return tokenRequest({
    grant_type: "refresh_token",
    refresh_token: refresh,
    client_id: clientId
  });
}

async function api(path, method = "GET") {
  const token = await accessToken();

  const response = await fetch(
    "https://api.spotify.com/v1/" + path,
    {
      method,
      headers: { Authorization: "Bearer " + token }
    }
  );

  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    throw new Error(
      data.error?.message || "Spotify error " + response.status
    );
  }

  if (method === "POST" || response.status === 204) {
    return null;
  }

  return response.json();
}

function connected() {
  $("connection").textContent = "Connected to Spotify";
  $("queue").disabled = batchActive;
  $("login").textContent = "Reconnect Spotify";
}

async function initialize() {
  const params = new URLSearchParams(location.search);
  if (params.has("error")) {
    log("Spotify authorization was not completed.");
    history.replaceState({}, "", redirect);
    return;
  }
  if (params.has("code")) {
    if (params.get("state") !== sessionStorage.getItem("state")) {
      log("Authorization state mismatch. Reconnect Spotify.");
      history.replaceState({}, "", redirect);
      return;
    }

    try {
      await tokenRequest({
        client_id: clientId,
        grant_type: "authorization_code",
        code: params.get("code"),
        redirect_uri: redirect,
        code_verifier: sessionStorage.getItem("verifier")
      });
      sessionStorage.removeItem("verifier");
      sessionStorage.removeItem("state");
      connected();
    } catch (error) {
      log(error.message);
    }
    history.replaceState({}, "", redirect);
  } else if (localStorage.getItem("refresh")) {
    try {
      await accessToken();
      connected();
    } catch {
      log("Please reconnect Spotify.");
    }
  }
}

const normalize = s => s.toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9]/g, "");

function directTrack(line) {
  const match = line.match(/^(?:https:\/\/open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/|spotify:track:)([A-Za-z0-9]{22})(?:[?#][^\s]*)?$/i);
  return match ? {uri: "spotify:track:" + match[1], name: "Spotify track " + match[1], artists: []} : null;
}

const words = s => s.toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

function baseTitle(s) {
  return s.replace(/\s*\([^)]*\)\s*$/, "").replace(/\s*\[[^\]]*\]\s*$/, "")
    .replace(/\s+-\s+.*$/, "").trim();
}

function scoreTrack(track, title, artist) {
  const a = words(artist);
  const artistMatch = track.artists.some(x => {
    const b = words(x.name);
    return b && (a === b || (" " + a + " ").includes(" " + b + " "));
  });
  if (!artistMatch) return 0;
  const t = normalize(title), n = normalize(track.name);
  if (!t || !n) return 0;
  if (t === n) return 100;
  if (t === normalize(baseTitle(track.name)) && !/\b(remix|live|acoustic|edit|instrumental|demo|cover|sped up|slowed)\b/i.test(track.name.slice(baseTitle(track.name).length))) return 90;
  if (normalize(baseTitle(title)) === normalize(baseTitle(track.name))) return 75;
  const tokens = words(title).split(" ");
  const other = words(track.name).split(" ");
  return tokens.some(x => x.length > 2 && other.includes(x)) ? 50 : 20;
}

function chooseTrack(line, tracks, progress) {
  return new Promise(resolve => {
    const dialog = $("picker"), options = $("options"), add = $("pick-add"), skip = $("pick-skip");
    let selected = null;
    $("picker-query").textContent = progress + " · " + line;
    options.replaceChildren();
    add.disabled = true;
    for (const track of tracks) {
      const label = document.createElement("label");
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "track-choice";
      radio.addEventListener("change", () => {
        selected = track;
        add.disabled = false;
      });
      label.append(radio);
      const artwork = track.album?.images?.[0]?.url;
      if (artwork && artwork.startsWith("https://")) {
        const img = document.createElement("img");
        img.src = artwork;
        img.alt = "";
        img.addEventListener("error", () => img.remove());
        label.append(img);
      }
      const info = document.createElement("span");
      const title = document.createElement("strong");
      title.textContent = track.name;
      const artists = document.createElement("small");
      artists.textContent = track.artists.map(a => a.name).join(", ");
      info.append(title, artists);
      if (track.album?.name) {
        const album = document.createElement("small");
        album.textContent = track.album.name + (track.album.release_date ? " · " + track.album.release_date.slice(0,4) : "");
        info.append(album);
      }
      label.append(info);
      options.append(label);
    }
    let choice = null;
    add.onclick = () => { if (selected) { choice = selected; dialog.close(); } };
    skip.onclick = () => dialog.close();
    dialog.addEventListener("close", () => {
      add.onclick = null;
      skip.onclick = null;
      options.replaceChildren();
      resolve(choice);
    }, {once: true});
    dialog.showModal();
  });
}

async function findTrack(line) {
  const direct = directTrack(line);
  if (direct) return direct;
  const parts = line.split(/\s+[—–-]\s+/);
  const artist = parts.pop().trim();
  const title = parts.join(" - ").trim();
  if (!title || !artist) return null;

  const candidates = new Map();
  const search = async q => {
    const data = await api("search?type=track&limit=10&q=" + encodeURIComponent(q));
    for (const track of data.tracks?.items || []) {
      if (track?.uri && track.artists && track.is_playable !== false) candidates.set(track.uri, track);
    }
  };
  const ranked = () => [...candidates.values()].map(track => ({track, score: scoreTrack(track, title, artist)}))
    .filter(x => x.score > 0).sort((a,b) => b.score - a.score);
  await search("track:" + title + " artist:" + artist);
  let results = ranked();
  if (results[0]?.score !== 100) {
    await search(title + " " + artist);
    results = ranked();
  }
  if (results[0]?.score === 100) return results[0].track;
  if (results[0]?.score === 90 && results.filter(x => x.score === 90).every(x => normalize(x.track.name) === normalize(results[0].track.name))) return results[0].track;
  if (!results.length) return null;
  return {choices: results.slice(0, 5).map(x => x.track)};
}

function trackLabel(track) {
  return track.name + (track.artists.length ? " — " + track.artists.map(a => a.name).join(", ") : "");
}
let batchActive = false;
function showPanel(title, detail, entries) {
  const panel = $("batch-result");
  panel.replaceChildren();
  panel.hidden = false;
  const heading = document.createElement("h2");
  heading.textContent = title;
  const summary = document.createElement("p");
  summary.textContent = detail;
  panel.append(heading, summary);
  for (const entry of entries) {
    const p = document.createElement("p");
    p.textContent = entry;
    panel.append(p);
  }
  return panel;
}
function panelButton(panel, label, action, secondary = false) {
  const button = document.createElement("button");
  button.textContent = label;
  if (secondary) button.className = "secondary";
  button.onclick = action;
  panel.append(button);
}
function confirmBatch(rows) {
  return new Promise(resolve => {
    const panel = showPanel("Ready to queue", rows.length + " songs selected", rows.map(r => trackLabel(r.track)));
    const finish = value => { panel.replaceChildren(); panel.hidden = true; resolve(value); };
    panelButton(panel, "Add " + rows.length + " songs to Spotify", () => finish(true));
    panelButton(panel, "Cancel batch", () => finish(false), true);
  });
}
function resetBatch(lines = []) {
  $("batch-result").hidden = true;
  $("batch-result").replaceChildren();
  $("songs").value = lines.join("\n");
  $("songs").hidden = false;
  $("queue").hidden = false;
  $("clear").hidden = false;
  $("queue").disabled = false;
  $("login").disabled = false;
  $("status").textContent = "";
  batchActive = false;
}
async function addQueue() {
  if (batchActive) return;
  const lines = [...new Set($("songs").value.split("\n").map(s => s.trim()).filter(Boolean))];
  if (!lines.length) { log("Paste your song list first."); return; }
  batchActive = true;
  $("queue").disabled = true;
  $("login").disabled = true;
  $("songs").hidden = true;
  $("queue").hidden = true;
  $("clear").hidden = true;
  $("status").textContent = "";
  const rows = lines.map(line => ({line, state:"pending"}));
  const seen = new Set();
  try {
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      $("status").textContent = "Analyzing " + (i+1) + " of " + rows.length + "…\n" + r.line;
      try {
        const match = await findTrack(r.line);
        if (match?.choices) { r.choices = match.choices; r.state = "review"; }
        else if (match) { r.track = match; r.state = "ready"; }
        else r.state = "not found";
      } catch (e) { r.state = "failed"; r.error = e.message; }
    }
    const review = rows.filter(r => r.state === "review");
    $("status").textContent = review.length ? "Analysis complete. Review " + review.length + " uncertain matches." : "Analysis complete.";
    for (let i = 0; i < review.length; i++) {
      const r = review[i];
      r.track = await chooseTrack(r.line, r.choices, "Match " + (i+1) + " of " + review.length);
      r.state = r.track ? "ready" : "skipped";
    }
    for (const r of rows.filter(r => r.state === "ready")) {
      if (seen.has(r.track.uri)) r.state = "duplicate";
      else seen.add(r.track.uri);
    }
    const ready = rows.filter(r => r.state === "ready");
    if (ready.length && review.length && !(await confirmBatch(ready))) {
      for (const r of ready) r.state = "skipped";
    } else if (ready.length) {
      $("status").textContent = "Checking Spotify playback…";
      const devices = await api("me/player/devices");
      if (!devices.devices?.some(d => d.is_active)) throw new Error("Open Spotify and start playing a song first.");
      for (let i = 0; i < ready.length; i++) {
        const r = ready[i];
        $("status").textContent = "Adding " + (i+1) + " of " + ready.length + "…";
        try {
          await api("me/player/queue?uri=" + encodeURIComponent(r.track.uri), "POST");
          r.state = "added";
        } catch (e) { r.state = "failed"; r.error = e.message; }
        await new Promise(resolve => setTimeout(resolve, 350));
      }
    }
  } catch (e) {
    for (const r of rows) if (["pending","ready","review"].includes(r.state)) { r.state = "failed"; r.error = e.message; }
  }
  $("status").textContent = "";
  const count = state => rows.filter(r => r.state === state).length;
  const added = count("added");
  const panel = showPanel(added === rows.length ? "Queue complete!" : "Batch finished", added + " added · " + count("skipped") + " skipped · " + count("not found") + " not found · " + count("failed") + " failed · " + count("duplicate") + " duplicates omitted", rows.map(r => r.state + ": " + (r.track ? trackLabel(r.track) : r.line) + (r.error ? " (" + r.error + ")" : "")));
  const retry = rows.filter(r => ["failed","not found"].includes(r.state)).map(r => r.line);
  if (retry.length) panelButton(panel, "Review unsuccessful songs", () => resetBatch(retry), true);
  panelButton(panel, "Start a new batch", () => resetBatch());
}

$("login").onclick = () => authorize().catch(e => log(e.message));
$("queue").onclick = addQueue;
$("clear").onclick = () => {
  $("songs").value = "";
  $("status").textContent = "";
};

initialize();
</script>
</body>
</html>
